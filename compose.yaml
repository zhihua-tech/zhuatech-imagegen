services:
  api:
    build: ./backend
    environment:
      ZHUATECH_IMAGE_GEN_PROVIDER: ${ZHUATECH_IMAGE_GEN_PROVIDER:-local}
      ZHUATECH_IMAGE_GEN_BASE_URL: ${ZHUATECH_IMAGE_GEN_BASE_URL:-}
      ZHUATECH_IMAGE_GEN_MODEL: ${ZHUATECH_IMAGE_GEN_MODEL:-text-to-image-provider-model}
      ZHUATECH_IMAGE_GEN_API_KEY: ${ZHUATECH_IMAGE_GEN_API_KEY:-}
    ports: ["8080:8080"]
  web:
    image: nginx:1.27-alpine
    volumes: ["./frontend:/usr/share/nginx/html:ro"]
    ports: ["8088:80"]
